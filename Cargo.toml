[package]
name = "streams-plugin-tts"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tts"
path = "src/main.rs"

[[bin]]
name = "fake-tts-engine"
path = "src/bin/fake-tts-engine.rs"
test = false
bench = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[workspace]
